version: "2"
run:
  modules-download-mode: readonly
linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    govet:
      disable:
        - fieldalignment
      enable-all: true
  exclusions:
    generated: lax
    rules:
      - path: (.+)\.go$
        text: G501
      - path: (.+)\.go$
        text: G401
      - path: (.+)\.go$
        text: G204
      - path: (.+)\.go$
        text: G302
      - path: (.+)\.go$
        text: G304
    paths:
      - archive
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - archive
      - third_party$
      - builtin$
      - examples$
